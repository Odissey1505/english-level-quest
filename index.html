<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Level Quest</title>
<meta name="description" content="Adaptive CEFR placement test (A1–C1) for ages 10–12, 13–17 and adults — an interactive book of short English challenges.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>📖</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="default">
<div id="ambient" aria-hidden="true"></div>

<main class="book-wrap">
  <div class="book" id="book">
    <div class="pages-stage">
      <header class="book-header">
        <div class="chapter-badge"><span class="chapter-icon" id="chapter-icon">📖</span><span id="chapter-name">English Level Quest</span></div>
        <nav class="chapter-track" id="chapter-track" aria-label="Chapters"></nav>
        <div class="student-chip hidden" id="student-chip"></div>
      </header>

      <div class="spread-scene" id="spread-scene">
        <div class="book-spread" id="book-spread">
          <section class="leaf leaf-left" id="leaf-0" aria-live="polite"><div class="leaf-inner"></div><div class="page-num"></div></section>
          <div class="book-spine" aria-hidden="true"></div>
          <section class="leaf leaf-right" id="leaf-1" aria-live="polite"><div class="leaf-inner"></div><div class="page-num"></div></section>
        </div>
      </div>

      <footer class="spread-footer" id="spread-footer">
        <div class="footer-status" id="footer-status"></div>
        <div class="footer-actions" id="footer-actions">
          <button class="turn-page-btn" id="turn-btn" type="button">Turn the page <span aria-hidden="true">➜</span></button>
        </div>
      </footer>
    </div>
  </div>
</main>

<div class="report-overlay hidden" id="report-overlay" role="dialog" aria-modal="true" aria-label="Teacher report">
  <div class="report-doc" id="report-doc"></div>
</div>

<noscript><p style="padding:2rem;text-align:center">English Level Quest needs JavaScript to run.</p></noscript>

<script src="js/question-bank.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
