<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Level Quest</title>
<meta name="description" content="Adaptive CEFR placement test (A1–C1) for ages 10–12, 13–17 and adults — an interactive book of short English challenges.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>📖</text></svg>">
<style>
/* ============================================================================
   ENGLISH LEVEL QUEST — styles
   Open book, one task per page, real page-turn. No vertical scrolling:
   every page auto-fits its content (see fitLeaf() in app.js).
   Three age themes: kid (10–12), teen (13–17), adult.
   ========================================================================== */

/* ---------------- THEME TOKENS ---------------- */
:root,
body[data-theme="default"],
body[data-theme="kid"] {
  --bg: radial-gradient(circle at 15% 10%, #fff7e6 0%, transparent 45%),
        radial-gradient(circle at 85% 90%, #ffe9c9 0%, transparent 40%),
        linear-gradient(160deg, #f7ead0 0%, #ecd9a8 45%, #dcc182 100%);
  --cover: linear-gradient(135deg, #8a5a2b, #5f3d1c);
  --paper: #fffaf0;
  --paper-2: #f4e8c8;
  --edge: #e2cd97;
  --ink: #3a2a18;
  --ink-soft: #6b5638;
  --accent: #c99a2e;
  --accent-light: #f0cf72;
  --accent-ink: #4a3410;
  --accent-2: #2f7a55;
  --sky: #3e7fb0;
  --good: #39a06b;
  --good-bg: #dff5e6;
  --bad: #d5504b;
  --bad-bg: #fbe3e1;
  --panel-border: 2px solid var(--edge);
  --panel-shadow: 0 6px 14px rgba(120, 90, 30, .12);
  --radius: 16px;
  --radius-sm: 12px;
  --font-display: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  --font-body: 'Baloo 2', 'Trebuchet MS', 'Segoe UI Rounded', 'Segoe UI', Verdana, sans-serif;
  --spine: linear-gradient(90deg, rgba(90,60,20,.06), rgba(90,60,20,.32), rgba(90,60,20,.06));
}
body[data-theme="kid"] {
  --cover: linear-gradient(135deg, #6fae4f, #2f6b33);
  --accent-2: #2f7a55;
}

/* teen: graphic-novel look — ink outlines, flat offset shadows, nothing cute */
body[data-theme="teen"] {
  --bg: radial-gradient(rgba(255,255,255,.06) 1.2px, transparent 1.3px) 0 0 / 14px 14px,
        linear-gradient(160deg, #262a3b 0%, #191b27 60%, #11121a 100%);
  --cover: linear-gradient(135deg, #2b2f45, #12131c);
  --paper: #fbfaf6;
  --paper-2: #eeeef3;
  --edge: #15161c;
  --ink: #15161c;
  --ink-soft: #4a4c5a;
  --accent: #ffd23f;
  --accent-light: #ffe27a;
  --accent-ink: #15161c;
  --accent-2: #5b5bf0;
  --sky: #5b5bf0;
  --good: #1fae6a;
  --good-bg: #d9f7e7;
  --bad: #ef3e5c;
  --bad-bg: #ffe0e6;
  --panel-border: 2.5px solid #15161c;
  --panel-shadow: 4px 4px 0 #15161c;
  --radius: 6px;
  --radius-sm: 4px;
  --font-display: 'Avenir Next Condensed', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --spine: linear-gradient(90deg, rgba(0,0,0,.04), rgba(0,0,0,.28), rgba(0,0,0,.04));
}

/* adult: calm, editorial notebook */
body[data-theme="adult"] {
  --bg: linear-gradient(160deg, #ece8e0 0%, #ddd6c9 100%);
  --cover: linear-gradient(135deg, #2b3d58, #172235);
  --paper: #fdfbf6;
  --paper-2: #f1ece2;
  --edge: #d9cfbd;
  --ink: #1f2733;
  --ink-soft: #586273;
  --accent: #1f7a6d;
  --accent-light: #2f9b8b;
  --accent-ink: #ffffff;
  --accent-2: #b88a44;
  --sky: #2d6a99;
  --good: #23855f;
  --good-bg: #e2f3eb;
  --bad: #b8453f;
  --bad-bg: #f8e5e3;
  --panel-border: 1.5px solid var(--edge);
  --panel-shadow: 0 2px 8px rgba(30, 40, 60, .07);
  --radius: 12px;
  --radius-sm: 9px;
  --font-display: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --font-body: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --spine: linear-gradient(90deg, rgba(20,30,50,.03), rgba(20,30,50,.2), rgba(20,30,50,.03));
}

/* ---------------- BASE ---------------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  overflow: hidden;
  transition: background .6s ease;
}
button { font-family: inherit; }
.hidden { display: none !important; }
::selection { background: var(--accent-light); }

#ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.spark {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  background: radial-gradient(circle, #fff8dc 0%, #ffd75e 60%, transparent 75%);
  opacity: .85; animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(0) scale(.6); opacity: 0; }
  10% { opacity: .9; } 90% { opacity: .6; }
  100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
}
body:not([data-theme="kid"]):not([data-theme="default"]) #ambient { display: none; }

/* ---------------- BOOK SHELL ---------------- */
.book-wrap {
  position: relative; z-index: 1;
  width: min(1440px, 97vw);
  height: min(900px, calc(100vh - 24px));
  height: min(900px, calc(100dvh - 24px));
}
.book {
  width: 100%; height: 100%;
  background: var(--cover);
  border-radius: 26px;
  padding: 12px;
  box-shadow: 0 30px 60px rgba(20, 14, 8, .4);
  display: flex;
  transition: background .8s ease;
}
body[data-theme="teen"] .book { border-radius: 10px; box-shadow: 8px 8px 0 #000, 0 30px 60px rgba(0,0,0,.5); }
.pages-stage {
  position: relative; flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--paper-2);
  border-radius: 18px;
  padding: clamp(8px, 1.6vh, 16px);
  box-shadow: inset 0 0 0 2px var(--edge);
}
body[data-theme="teen"] .pages-stage { border-radius: 6px; }

/* header */
.book-header {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 38px;
}
.chapter-badge {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: .95rem;
  color: var(--ink); background: var(--paper);
  padding: 6px 14px; border-radius: 50px; border: var(--panel-border);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%;
}
body[data-theme="teen"] .chapter-badge { border-radius: 4px; text-transform: uppercase; letter-spacing: .06em; box-shadow: 3px 3px 0 #15161c; }
.chapter-track { display: flex; gap: 6px; align-items: center; justify-content: center; flex: 1; min-width: 0; }
.track-dot {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .95rem; background: var(--paper); border: var(--panel-border);
  opacity: .45; transition: all .3s ease; flex: 0 0 auto;
}
.track-dot.done { opacity: .9; }
.track-dot.current { opacity: 1; transform: scale(1.18); box-shadow: 0 0 0 3px var(--accent-light); }
body[data-theme="teen"] .track-dot { border-radius: 4px; }
.student-chip {
  font-weight: 700; font-size: .85rem; color: var(--ink-soft);
  background: var(--paper); border: var(--panel-border);
  padding: 6px 12px; border-radius: 50px; white-space: nowrap; max-width: 28%; overflow: hidden; text-overflow: ellipsis;
}
body[data-theme="teen"] .student-chip { border-radius: 4px; }

/* ---------------- SPREAD ---------------- */
.spread-scene { position: relative; flex: 1 1 auto; min-height: 0; perspective: 2800px; }
.book-spread {
  position: absolute; inset: 0;
  display: flex;
  background: var(--paper);
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(60, 40, 10, .18), inset 0 0 0 1px var(--edge);
}
body[data-theme="teen"] .book-spread { border-radius: 4px; box-shadow: 5px 5px 0 #15161c; }
body[data-theme="teen"] .book-spread::after {
  content: ""; position: absolute; inset: 0; border: 2.5px solid #15161c; border-radius: 4px;
  pointer-events: none; z-index: 5;
}
.leaf {
  position: relative;
  flex: 1 1 50%; min-width: 0; min-height: 0;
  overflow: hidden;
  padding: clamp(14px, 2.6vh, 30px) clamp(14px, 2.2vw, 34px) clamp(22px, 3.6vh, 38px);
  background: var(--paper);
}
.leaf-left { border-radius: 14px 0 0 14px; background: linear-gradient(90deg, var(--paper) 88%, rgba(0,0,0,.035)); }
.leaf-right { border-radius: 0 14px 14px 0; background: linear-gradient(270deg, var(--paper) 88%, rgba(0,0,0,.035)); }
body[data-theme="teen"] .leaf-left, body[data-theme="teen"] .leaf-right { border-radius: 4px; }
.book-spine { flex: 0 0 16px; background: var(--spine); box-shadow: inset 0 0 12px rgba(0,0,0,.18); }
.book-spread.single .leaf-right, .book-spread.single .book-spine { display: none; }
.book-spread.single .leaf-left { border-radius: 14px; flex-basis: 100%; background: var(--paper); }

/* every page's content lives in .leaf-inner; --fit shrinks it to avoid scroll */
.leaf-inner {
  --fit: 1;
  height: 100%;
  overflow: hidden;
  font-size: calc(var(--fit) * clamp(14px, 2vh, 19px));
}
.page-num {
  position: absolute; bottom: clamp(6px, 1.2vh, 12px); left: 0; right: 0;
  text-align: center; font-size: .72rem; color: var(--ink-soft); opacity: .6;
  font-family: var(--font-display); letter-spacing: .1em;
}

/* generic page layout */
.pg { min-height: 100%; display: flex; flex-direction: column; gap: .75em; }
.pg-body { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; gap: .8em; }
.pg-center { align-items: center; text-align: center; }
.pg-top { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: .5em; }
.skill-badge {
  display: inline-flex; align-items: center; gap: .35em;
  font-weight: 800; font-size: .78em;
  background: var(--paper-2); border: var(--panel-border);
  padding: .3em .8em; border-radius: 50px; color: var(--ink);
}
body[data-theme="teen"] .skill-badge { border-radius: 3px; text-transform: uppercase; letter-spacing: .05em; }
.q-type { font-size: .72em; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .07em; text-align: right; }
.q-hint { font-size: .78em; color: var(--ink-soft); text-align: center; margin-top: -.3em; }
.q-hint .ua { opacity: .8; }

h1, h2, h3 { font-family: var(--font-display); margin: 0; color: var(--ink); line-height: 1.15; }
.eyebrow { font-family: var(--font-display); letter-spacing: .16em; text-transform: uppercase; font-size: .72em; color: var(--ink-soft); }
.ua { color: var(--ink-soft); }

/* stimulus pieces */
.illus { font-size: 3.4em; text-align: center; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.14)); }
.q-text { font-size: 1.22em; font-weight: 700; text-align: center; line-height: 1.38; }
.q-text .gap, .sentence-card .gap {
  display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--accent);
  margin: 0 .15em; height: 1em; vertical-align: baseline;
}
.sentence-card {
  font-size: 1.3em; font-weight: 700; text-align: center; line-height: 1.4;
  background: var(--paper-2); border: var(--panel-border); box-shadow: var(--panel-shadow);
  border-radius: var(--radius); padding: .7em 1em;
}
.sentence-card .from { display: block; font-size: .72em; font-weight: 600; color: var(--ink-soft); margin-bottom: .35em; }
.sentence-card.error { text-decoration: underline wavy var(--bad); text-underline-offset: .25em; text-decoration-thickness: 2px; }
.passage {
  background: var(--paper-2); border: var(--panel-border); box-shadow: var(--panel-shadow);
  border-radius: var(--radius); padding: .8em 1em;
  font-size: .95em; line-height: 1.5; white-space: pre-line;
}
.passage.notice { font-family: 'Courier New', monospace; font-size: .9em; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: .45em; }
.chip-word {
  background: var(--paper-2); border: var(--panel-border); border-radius: 50px;
  padding: .35em .85em; font-weight: 700; box-shadow: var(--panel-shadow);
}
body[data-theme="teen"] .chip-word { border-radius: 3px; }

/* chat bubbles */
.chat { display: flex; flex-direction: column; gap: .5em; }
.bubble {
  max-width: 85%; padding: .6em .95em; border-radius: 1.1em;
  background: var(--paper-2); border: var(--panel-border); line-height: 1.4; font-weight: 600;
  position: relative;
}
.bubble .who { display: block; font-size: .7em; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); font-weight: 800; margin-bottom: .15em; }
.bubble.them { align-self: flex-start; border-bottom-left-radius: .3em; }
.bubble.me { align-self: flex-end; border-bottom-right-radius: .3em; background: var(--accent-light); color: var(--accent-ink); }
body[data-theme="adult"] .bubble.me { color: #fff; }
body[data-theme="teen"] .bubble { border-radius: 8px; box-shadow: 3px 3px 0 #15161c; }
.bubble.big { font-size: 1.15em; max-width: 100%; }

/* listening */
.audio-panel { display: flex; flex-direction: column; align-items: center; gap: .45em; }
.play-btn {
  width: 5.2em; height: 5.2em; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--sky), #24557a); color: #fff; font-size: 1em;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 22px rgba(30, 80, 120, .35); transition: transform .15s ease;
}
.play-btn svg { width: 2.2em; height: 2.2em; }
.play-btn:hover:not(:disabled) { transform: scale(1.06); }
.play-btn:disabled { opacity: .45; cursor: not-allowed; }
.play-btn.playing { animation: pulse 1s ease-in-out infinite; }
body[data-theme="teen"] .play-btn { border-radius: 6px; box-shadow: 4px 4px 0 #15161c; border: 2.5px solid #15161c; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(62,127,176,.45); } 50% { box-shadow: 0 0 0 .7em rgba(62,127,176,0); } }
.plays-left { font-size: .8em; color: var(--ink-soft); font-weight: 700; }
.wave { display: flex; gap: .2em; height: 1.4em; align-items: center; }
.wave i { width: .28em; background: var(--sky); border-radius: 2px; height: 30%; opacity: .5; }
.playing-wave .wave i { animation: wave .9s ease-in-out infinite; opacity: 1; }
.wave i:nth-child(2) { animation-delay: .1s; } .wave i:nth-child(3) { animation-delay: .2s; }
.wave i:nth-child(4) { animation-delay: .3s; } .wave i:nth-child(5) { animation-delay: .4s; }
@keyframes wave { 0%,100% { height: 25%; } 50% { height: 100%; } }
.transcript-reveal { font-size: .82em; color: var(--ink-soft); font-style: italic; text-align: center; }

/* options */
.options { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: .6em; }
.options.one-col { grid-template-columns: 1fr; }
.opt-btn {
  display: flex; align-items: center; gap: .6em;
  min-height: 3em; padding: .55em .8em;
  font-size: .98em; font-weight: 650; text-align: left; line-height: 1.3;
  color: var(--ink); background: var(--paper);
  border: var(--panel-border); border-radius: var(--radius-sm);
  cursor: pointer; transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .2s ease;
}
.opt-btn .letter {
  flex: 0 0 auto; width: 1.7em; height: 1.7em; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--paper-2); font-size: .78em; font-weight: 800; color: var(--ink-soft);
}
body[data-theme="teen"] .opt-btn { box-shadow: 3px 3px 0 #15161c; }
body[data-theme="teen"] .opt-btn .letter { border-radius: 3px; background: #15161c; color: #fff; }
.opt-btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.08); }
body[data-theme="teen"] .opt-btn:hover:not(:disabled) { border-color: #15161c; background: var(--accent-light); box-shadow: 5px 5px 0 #15161c; }
.opt-btn:disabled { cursor: default; }
.opt-btn.is-correct { background: var(--good-bg); border-color: var(--good); animation: pop .35s ease; }
.opt-btn.is-wrong { background: var(--bad-bg); border-color: var(--bad); animation: shake .4s ease; }
.opt-btn.dim { opacity: .45; }
@keyframes pop { 50% { transform: scale(1.035); } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* feedback — always reserves space, so nothing jumps */
.feedback {
  flex: 0 0 auto; min-height: 3.2em;
  display: flex; align-items: center; gap: .55em;
  padding: .45em .8em; border-radius: var(--radius-sm);
  font-size: .82em; line-height: 1.3;
  visibility: hidden; opacity: 0; transition: opacity .25s ease;
  border: 1.5px solid transparent;
}
.feedback.show { visibility: visible; opacity: 1; }
.feedback.good { background: var(--good-bg); border-color: var(--good); }
.feedback.bad { background: var(--bad-bg); border-color: var(--bad); }
.feedback.neutral { background: var(--paper-2); border-color: var(--edge); }
.feedback .fb-icon { font-size: 1.5em; flex: 0 0 auto; }
.feedback b { display: block; }

/* ---------------- STATIC PAGES ---------------- */
.cover-emblem { font-size: 5.6em; line-height: 1; animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 10px 14px rgba(0,0,0,.2)); }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
.cover-title { font-size: 2.7em; letter-spacing: .01em; }
body[data-theme="default"] .cover-title, body[data-theme="kid"] .cover-title {
  background: linear-gradient(90deg, #a9711f, #6f4a17, #a9711f);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
body[data-theme="teen"] .cover-title { text-transform: uppercase; font-weight: 900; letter-spacing: .02em; }
.cover-sub { font-size: 1.15em; color: var(--ink-soft); }
.cover-stars { display: flex; gap: .6em; justify-content: center; font-size: 1.3em; }
.cover-stars span { animation: twinkle 1.8s ease-in-out infinite; }
.cover-stars span:nth-child(2) { animation-delay: .3s; } .cover-stars span:nth-child(3) { animation-delay: .6s; }
@keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
.cover-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: .5em; font-size: .8em; }
.cover-meta span { background: var(--paper-2); border: var(--panel-border); border-radius: 50px; padding: .25em .8em; font-weight: 700; color: var(--ink-soft); }

.field label { display: block; font-weight: 800; margin-bottom: .35em; }
.text-input {
  width: 100%; font: inherit; font-size: 1.05em; padding: .65em .85em;
  border-radius: var(--radius-sm); border: var(--panel-border); background: var(--paper);
  color: var(--ink);
}
.text-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.age-cards { display: grid; gap: .6em; }
.age-card {
  display: flex; align-items: center; gap: .8em; width: 100%;
  text-align: left; padding: .7em .9em; cursor: pointer;
  border: var(--panel-border); border-radius: var(--radius); background: var(--paper);
  transition: all .18s ease; color: var(--ink); font-size: 1em;
}
.age-card .age-ico { font-size: 1.9em; flex: 0 0 auto; }
.age-card b { display: block; font-size: 1.05em; }
.age-card small { color: var(--ink-soft); font-size: .82em; }
.age-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.age-card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); background: var(--paper-2); }
body[data-theme="teen"] .age-card { box-shadow: 3px 3px 0 #15161c; }
body[data-theme="teen"] .age-card.selected { background: var(--accent-light); box-shadow: 5px 5px 0 #15161c; }
.form-note { font-size: .78em; color: var(--ink-soft); }

.howto-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .55em; }
.howto-list li { display: flex; gap: .75em; align-items: flex-start; background: var(--paper-2); border: var(--panel-border); border-radius: var(--radius-sm); padding: .55em .8em; line-height: 1.35; }
.howto-list .ico { font-size: 1.35em; flex: 0 0 auto; line-height: 1.1; }
.howto-list small { display: block; color: var(--ink-soft); }

.opener-ico {
  width: 3.2em; height: 3.2em; border-radius: 50%; margin: 0 auto;
  display: flex; align-items: center; justify-content: center; font-size: 2.3em;
  background: var(--paper-2); border: var(--panel-border); box-shadow: var(--panel-shadow);
  animation: bob 3.2s ease-in-out infinite;
}
body[data-theme="teen"] .opener-ico { border-radius: 8px; animation: none; transform: rotate(-3deg); }
.opener-title { font-size: 2.1em; }
body[data-theme="teen"] .opener-title { text-transform: uppercase; font-weight: 900; }

.turn-sheet {

.turn-sheet .face.front::after { background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0) 45%); }
.turn-sheet .face.back::after { background: linear-gradient(270deg, rgba(0,0,0,.22), rgba(0,0,0,0) 45%); }

.cast-shadow.on { animation: castShadow .9s ease-in-out forwards; }
@keyframes castShadow { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

.burst { position: fixed; pointer-events: none; z-index: 80; font-size: 1.3rem; animation: burstUp .9s ease-out forwards; }

     prompt:"\"The new rule has _____ concerns among parents.\"",
     options:["raised","risen","grown","lifted"],
     expl:"«Raise concerns» — викликати занепокоєння; «rise» — неперехідне дієслово."}
  ];
  const counters = {};
  for (const age of ["kid","teen","adult"]) {
    sup.forEach(s => {
      const key = `${age}_${s.lvl}_${s.skill}`;
      counters[key] = (counters[key] || 0) + 1;
      const item = {
        id:`${age}_${s.lvl.toLowerCase()}_sup_${s.skill.toLowerCase()}_${String(counters[key]).padStart(3,"0")}`,
        ageGroup:AGE_GROUP[age], cefr:s.lvl, skill:s.skill, topic:s.topic, concept:s.concept,
        questionType:s.type, difficulty:s.d, diagnosticWeight:s.w,
        prompt:v(s.prompt, age), options:s.options.slice(), correctAnswer:0,
        explanation:s.expl, tags:["supplement", s.skill]
      };
      if (s.passage) item.passage = v(s.passage, age);
      if (s.audio) item.audioScript = v(s.audio, age);
      items.push(item);
    });
  }
  return items;
})()

];

if (typeof module !== "undefined" && module.exports) {

<script>
/* ============================================================================
   ENGLISH LEVEL QUEST — Adaptive assessment engine
   Pure logic, no DOM. Works in the browser (window.LQEngine) and in Node
   (module.exports) so it can be tested from the command line.

   Implements docs/architecture.md §5:
   - every skill is tracked independently (own level cursor + evidence)
   - each section opens easy and ramps up quickly ("ramp" phase), then, after
     the first mistake, only moves on multiple pieces of evidence ("settle")
   - secret-diagnostic items (diagnosticWeight >= 0.8) count as stronger evidence
   - the final estimate per skill comes from weighted accuracy per level,
     never from a single percentage
   ========================================================================== */
(function (root) {
  "use strict";

  const LEVELS = ["A1", "A2", "B1", "B2", "C1"];
  const SKILLS = ["vocabulary", "grammar", "realLife", "reading", "listening", "speaking"];

  // which bank skills feed which engine skill
  const SKILL_MATCH = {
    vocabulary: ["vocabulary"],
    grammar: ["grammar"],
    realLife: ["realLife"],
    reading: ["reading", "useOfEnglish"],
    listening: ["listening"],
    speaking: ["speaking"]
  };

  const SKILL_LABELS = {
    vocabulary: "Vocabulary",
    grammar: "Grammar",
    realLife: "Real-Life English",
    reading: "Reading & Use of English",
    listening: "Listening",
    speaking: "Speaking"
  };

  // follow-up prompts that stretch a strong speaker one notch up (brief §15)
  const STRETCH_FOLLOWUPS = [
    "Why do you like it? Tell me one more thing about it.",
    "How has this changed for you over time?",
    "Do you think most people feel the same way? Why or why not?",
    "What would someone who completely disagrees with you say — and how would you answer them?",
    "Is there a hidden assumption in the question itself that you would challenge?"
  ];
  const EASY_FOLLOWUP = "Can you tell me a little more? One or two more sentences is fine.";

  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function levelLabel(num) {
    if (num === null || num === undefined || isNaN(num)) return "—";
    const n = clamp(num, 0, 4);
    const base = Math.floor(n + 1e-9);
    const plus = (n - base) >= 0.5 && base < 4;
    return LEVELS[base] + (plus ? "+" : "");
  }

  function bucketSkill(bankSkill) {
    for (const s of SKILLS) if (SKILL_MATCH[s].includes(bankSkill)) return s;
    return bankSkill;
  }

  function humanize(slug) {
    if (!slug) return "";
    const s = String(slug).replace(/-/g, " ");
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function countWords(text) {
    if (!text) return 0;
    const m = String(text).trim().match(/[A-Za-z’'-]+/g);
    return m ? m.length : 0;
  }

  // -------------------------------------------------------------------------
  function createSession(opts) {
    const bank = opts.bank;
    const ageGroup = opts.ageGroup;
    const rng = opts.rng || Math.random;
    const pool = bank.filter(q => q.ageGroup === ageGroup);

    const used = new Set();
    const seenPassages = new Set();
    const log = [];          // scored answers
    const speakingLog = [];  // speaking responses
    const startedAt = Date.now();
    let finishedAt = null;
    let speakingOverride = null;

    const state = {};
    SKILLS.forEach(s => {
      state[s] = { level: 1, phase: "ramp", atLevel: [], floor: 0, recentConcepts: [] };
    });

    function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }

    function candidates(skill, levelIdx) {
      const lv = LEVELS[levelIdx];
      return pool.filter(q => SKILL_MATCH[skill].includes(q.skill) && q.cefr === lv && !used.has(q.id));
    }

    function rank(list, skill, firstAtLevel) {
      const recent = state[skill].recentConcepts;
      return list
        .map(q => {
          let score = rng();                                   // variety between learners
          if (recent.includes(q.concept)) score -= 2;          // don't repeat a concept back to back
          if (q.passage && seenPassages.has(q.passage)) score -= 1.5;
          if (firstAtLevel) score -= (q.difficulty || 3) * 0.35; // open a level with an easier item
          return { q, score };
        })
        .sort((a, b) => b.score - a.score)
        .map(x => x.q);
    }

    // nearest level that still has material (lower first on ties)
    function findItem(skill, levelIdx, firstAtLevel) {
      for (let d = 0; d <= 4; d++) {
        for (const L of d === 0 ? [levelIdx] : [levelIdx - d, levelIdx + d]) {
          if (L < 0 || L > 4) continue;
          const list = candidates(skill, L);
          if (list.length) return rank(list, skill, firstAtLevel && d === 0)[0];
        }
      }
      return null;
    }

    function pickItem(skill, levelIdx) {
      const st = state[skill];
      const L = levelIdx === undefined ? st.level : levelIdx;
      const item = findItem(skill, L, st.atLevel.length === 0);
      if (item) reserve(item);
      return item;
    }

    function reserve(item) {
      used.add(item.id);
      if (item.passage) seenPassages.add(item.passage);
      const s = bucketSkill(item.skill);
      if (state[s]) {
        state[s].recentConcepts.push(item.concept || item.function);
        if (state[s].recentConcepts.length > 3) state[s].recentConcepts.shift();
      }
    }

    // ---------------- Quick Start: fixed easy → harder ramp ----------------
    const QUICK_START = [
      { skill: "vocabulary", level: 0 },
      { skill: "grammar", level: 1 },
      { skill: "grammar", level: 2 }
    ];
    function pickQuickStart(i) {
      const spec = QUICK_START[i];
      return spec ? pickItem(spec.skill, spec.level) : null;
    }

    function seedFromQuickStart() {
      const qs = log.filter(e => e.section === "quickstart");
      const correct = qs.filter(e => e.correct).length;
      const seed = correct >= 3 ? 2 : correct === 2 ? 1 : 0;   // B1 / A2 / A1
      const open = Math.max(0, seed - 1);                        // every section opens a notch lower
      SKILLS.forEach(s => {
        state[s].level = open;
        state[s].phase = "ramp";
        state[s].atLevel = [];
      });
      return { correct, seed, open };
    }

    // ---------------- Recording + adaptation ----------------
    function record(item, ans) {
      const levelIdx = LEVELS.indexOf(item.cefr);
      const entry = {
        id: item.id,
        section: ans.section || null,
        skill: bucketSkill(item.skill),
        bankSkill: item.skill,
        cefr: item.cefr,
        levelIdx,
        concept: item.concept,
        questionType: item.questionType,
        weight: item.diagnosticWeight || 0.4,
        correct: !!ans.correct,
        prompt: item.prompt,
        chosen: ans.chosenText !== undefined ? ans.chosenText : null,
        correctText: item.options ? item.options[item.correctAnswer] : null,
        ms: ans.ms || null
      };
      log.push(entry);
      used.add(item.id);
      if (ans.adapt !== false) adapt(entry.skill, entry);
      return entry;
    }

    function adapt(skill, e) {
      const st = state[skill];
      if (!st) return;
      if (st.phase === "ramp") {
        if (e.correct) {
          st.floor = Math.max(st.floor, st.level);
          st.level = Math.min(4, st.level + 1);
          st.atLevel = [];
        } else {
          st.phase = "settle";
          st.atLevel = [{ correct: false, weight: e.weight }];
        }
        return;
      }
      st.atLevel.push({ correct: e.correct, weight: e.weight });
      const c = st.atLevel.filter(x => x.correct).length;
      const w = st.atLevel.length - c;
      const strongHit = e.correct && e.weight >= 0.8 && w === 0;
      if ((c >= 2 && c > w) || strongHit) {
        st.floor = Math.max(st.floor, st.level);
        st.level = Math.min(4, st.level + 1);
        st.atLevel = [];
      } else if (w >= 2 && w >= c) {
        const next = Math.max(0, st.level - 1);
        st.level = next;
        st.atLevel = [];
      }
    }

    // ---------------- Estimates ----------------
    function estimateSkill(skill) {
      const entries = log.filter(e => e.skill === skill);
      if (!entries.length) return null;
      const byL = LEVELS.map(() => ({ c: 0, t: 0, n: 0 }));
      entries.forEach(e => {
        const w = 0.5 + e.weight;
        byL[e.levelIdx].t += w;
        byL[e.levelIdx].n += 1;
        if (e.correct) byL[e.levelIdx].c += w;
      });
      const acc = L => (byL[L].n ? byL[L].c / byL[L].t : null);

      let est = -1;
      for (let L = 0; L < 5; L++) {
        const a = acc(L);
        if (a === null) continue;
        if (a >= 0.6) {
          // a lucky pass above a clearly failed lower level doesn't count
          let blocked = false;
          for (let k = 0; k < L; k++) if (byL[k].n >= 2 && acc(k) < 0.34) blocked = true;
          if (!blocked) est = L;
        }
      }
      if (est === -1) {
        const lowest = byL.findIndex(b => b.n > 0);
        return { num: Math.max(0, lowest - 1), emerging: lowest <= 0, answered: entries.length };
      }
      let num = est;
      if (est < 4 && byL[est + 1].n && acc(est + 1) >= 0.3) num += 0.5;
      return { num, emerging: false, answered: entries.length };
    }

    function speakingProvisional() {
      const done = speakingLog.filter(s => !s.skipped);
      if (!done.length) return null;
      const delta = { weak: -0.5, solid: 0, strong: 0.5 };
      const mean = done.reduce((sum, s) => sum + s.levelIdx + delta[s.heuristic], 0) / done.length;
      return { num: clamp(Math.floor(mean * 2) / 2, 0, 4), provisional: true, answered: done.length };
    }

    function estimates() {
      const skills = {};
      SKILLS.forEach(s => {
        if (s === "speaking") {
          if (speakingOverride !== null) skills.speaking = { num: speakingOverride, provisional: false, answered: speakingLog.length };
          else skills.speaking = speakingProvisional();
        } else {
          skills[s] = estimateSkill(s);
        }
      });
      let sum = 0, wsum = 0;
      SKILLS.forEach(s => {
        const e = skills[s];
        if (!e) return;
        const w = (s === "speaking" && e.provisional) ? 0.6 : 1;
        sum += e.num * w; wsum += w;
      });
      const overallNum = wsum ? Math.floor((sum / wsum) * 2 + 1e-9) / 2 : null;
      Object.keys(skills).forEach(s => { if (skills[s]) skills[s].label = levelLabel(skills[s].num); });
      return { skills, overall: { num: overallNum, label: levelLabel(overallNum) } };
    }

    function nonSpeakingMean() {
      const est = estimates().skills;
      const nums = SKILLS.filter(s => s !== "speaking" && est[s]).map(s => est[s].num);
      return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 1;
    }

    // ---------------- Speaking ladder (brief §15) ----------------
    function speakingBaseLevel() {
      return clamp(Math.round(nonSpeakingMean() - 0.75), 0, 4);
    }

    function pickSpeaking() {
      const L = speakingBaseLevel();
      state.speaking.level = L;
      return pickItem("speaking", L);
    }

    function speakingHeuristic(r, targetSec) {
      const target = targetSec || 30;
      let ratio;
      // ~1.8 words per second is a comfortable, fluent speaking pace
      if (r.words > 0) ratio = r.words / (target * 1.8);
      else ratio = (r.durationSec || 0) / target * 0.8;
      if (ratio < 0.35) return "weak";
      if (ratio < 0.75) return "solid";
      return "strong";
    }

    function followUpFor(baseItem, baseEntry) {
      const L = LEVELS.indexOf(baseItem.cefr);
      if (!baseEntry || baseEntry.skipped || baseEntry.heuristic === "weak") {
        return { prompt: EASY_FOLLOWUP, levelIdx: L, kind: "simplify" };
      }
      if (baseEntry.heuristic === "strong" && L < 4) {
        return { prompt: STRETCH_FOLLOWUPS[L + 1], levelIdx: L + 1, kind: "stretch" };
      }
      const fu = (baseItem.followUps && baseItem.followUps[0]) || STRETCH_FOLLOWUPS[L];
      return { prompt: fu, levelIdx: L, kind: "standard" };
    }

    function recordSpeaking(r) {
      const words = r.words !== undefined ? r.words : countWords(r.transcript || r.typed || "");
      const entry = {
        itemId: r.itemId,
        stage: r.stage,
        kind: r.kind || "base",
        prompt: r.prompt,
        levelIdx: r.levelIdx,
        cefr: LEVELS[r.levelIdx],
        function: r.function || null,
        transcript: r.transcript || "",
        typed: r.typed || "",
        durationSec: Math.round(r.durationSec || 0),
        targetSec: r.targetSec || 30,
        words,
        skipped: !!r.skipped,
        hasAudio: !!r.hasAudio
      };
      entry.heuristic = entry.skipped ? "weak" : speakingHeuristic(entry, entry.targetSec);
      speakingLog.push(entry);
      return entry;
    }

    function setSpeakingOverride(num) { speakingOverride = (num === null || num === "" || isNaN(num)) ? null : Number(num); }

    // ---------------- Level Boss: secret diagnostics just above the estimate ----------------
    function pickBoss(alreadyPicked) {
      const target = clamp(Math.floor(nonSpeakingMean()) + 1, 0, 4);
      const avoidConcepts = (alreadyPicked || []).map(q => q.concept);
      for (let d = 0; d <= 4; d++) {
        for (const L of d === 0 ? [target] : [target + d, target - d]) {
          if (L < 0 || L > 4) continue;
          const list = pool.filter(q => q.skill !== "speaking" && q.cefr === LEVELS[L] && !used.has(q.id) && !avoidConcepts.includes(q.concept));
          if (!list.length) continue;
          const top = Math.max(...list.map(q => q.diagnosticWeight || 0));
          const best = list.filter(q => (q.diagnosticWeight || 0) >= top - 0.05);
          const item = pick(best);
          reserve(item);
          return item;
        }
      }
      return null;
    }

    // ---------------- Teacher diagnostics (brief §24) ----------------
    function diagnostics() {
      const out = {};
      SKILLS.filter(s => s !== "speaking").forEach(s => {
        const byConcept = {};
        log.filter(e => e.skill === s).forEach(e => {
          const k = e.concept || "general";
          byConcept[k] = byConcept[k] || { concept: k, label: humanize(k), correct: 0, total: 0, levels: new Set() };
          byConcept[k].total += 1;
          if (e.correct) byConcept[k].correct += 1;
          byConcept[k].levels.add(e.cefr);
        });
        const strong = [], developing = [], needs = [];
        Object.values(byConcept).forEach(c => {
          const row = { concept: c.concept, label: c.label, correct: c.correct, total: c.total, levels: Array.from(c.levels).sort() };
          if (c.correct === c.total) strong.push(row);
          else if (c.correct === 0) needs.push(row);
          else developing.push(row);
        });
        out[s] = { strong, developing, needs };
      });
      const sp = { strong: [], developing: [], needs: [] };
      speakingLog.forEach(r => {
        const row = { concept: r.function || r.kind, label: humanize(r.function || r.kind) + " (" + r.cefr + ")", heuristic: r.heuristic };
        if (r.skipped || r.heuristic === "weak") sp.needs.push(row);
        else if (r.heuristic === "strong") sp.strong.push(row);
        else sp.developing.push(row);
      });
      out.speaking = sp;
      return out;
    }

    function finish() { finishedAt = Date.now(); }

    function exportData(meta) {
      const est = estimates();
      return {
        app: "English Level Quest",
        version: 1,
        student: Object.assign({ ageGroup }, meta || {}),
        startedAt: new Date(startedAt).toISOString(),
        finishedAt: new Date(finishedAt || Date.now()).toISOString(),
        durationMin: Math.round(((finishedAt || Date.now()) - startedAt) / 60000),
        overall: est.overall.label,
        skills: Object.fromEntries(SKILLS.map(s => [s, est.skills[s] ? est.skills[s].label : null])),
        speakingConfirmedByTeacher: speakingOverride !== null,
        diagnostics: JSON.parse(JSON.stringify(diagnostics())),
        answers: log,
        speaking: speakingLog
      };
    }

    return {
      ageGroup, pool, log, speakingLog, state,
      pickItem, pickQuickStart, seedFromQuickStart, record,
      pickSpeaking, followUpFor, recordSpeaking, setSpeakingOverride,
      pickBoss, estimates, diagnostics, finish, exportData,
      get startedAt() { return startedAt; },
      get finishedAt() { return finishedAt; },
      get speakingOverride() { return speakingOverride; }
    };
  }

  const API = { LEVELS, SKILLS, SKILL_LABELS, createSession, levelLabel, humanize, countWords, bucketSkill };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else root.LQEngine = API;
})(typeof window !== "undefined" ? window : this);

</script>

    "picture-choice": ["Look and choose.", "Подивись і обери."],

  const TOPIC_EMOJI = {
    family: "👨‍👩‍👧", friends: "🤝", friendships: "🤝", school: "🏫", education: "🎓", food: "🍽️", restaurants: "🍽️",
    travel: "✈️", holidays: "🏖️", shopping: "🛍️", money: "💰", health: "🩺", weather: "🌦️", home: "🏠", sports: "⚽",
    hobbies: "🎨", technology: "📱", "social-media": "📲", media: "📰", career: "💼", emotions: "💭", "basic-feelings": "💭",
    animals: "🐾", city: "🏙️", transport: "🚌", "daily-routine": "⏰", "personal-information": "🪪", films: "🎬", music: "🎵",
    environment: "🌍", society: "🏛️", ethics: "⚖️", communication: "💬", privacy: "🔒", consumerism: "🛒", decisions: "🧭",
    relationships: "💞", psychology: "🧠", innovation: "💡", "personal-goals": "🎯", childhood: "🧸", entertainment: "🎮",
    "personal-responsibility": "🤲", appearance: "🪞", personality: "🙂", plans: "🗓️", weekends: "🗓️", debate: "🗣️",
    science: "🔬", "daily-life": "☕", "work-life-balance": "⚖️"
  };

  const CANDO = {
    A1: ["Introduce yourself and talk about your family", "Understand simple everyday words and phrases", "Ask and answer very simple questions"],
    A2: ["Talk about your day, plans and past events", "Handle shopping, travel and ordering food", "Understand short, simple messages and notices"],
    B1: ["Explain experiences and give reasons for opinions", "Understand the main points of clear texts and talk", "Deal with most everyday situations on your own"],
    B2: ["Argue a point and support it with examples", "Understand attitude and implied meaning", "Speak naturally on a wide range of topics"],
    C1: ["Express complex ideas precisely and flexibly", "Notice nuance, register, irony and bias", "Build clear, well-structured arguments"]
  };
  const LEVEL_UA = {
    A1: "Розумієш і використовуєш прості знайомі фрази: про себе, родину, щоденні речі.",
    A2: "Спілкуєшся в простих повсякденних ситуаціях: покупки, подорожі, плани, минулі події.",
    B1: "Можеш самостійно розповісти про досвід, висловити й обґрунтувати думку на знайомі теми.",
    B2: "Вільно аргументуєш, розумієш підтекст і ставлення автора, говориш природно на широке коло тем.",
    C1: "Гнучко й точно висловлюєш складні ідеї, відчуваєш нюанси, регістр та іронію."
  };
  const GROUPS = { A1: "Beginner – Elementary", A2: "Elementary – Pre-Intermediate", B1: "Intermediate", B2: "Upper-Intermediate", C1: "Advanced" };

  const PRAISE = {
    kid: ["Brilliant! ✨", "You got it! 🎉", "Super! ⭐", "Lex is impressed! 🦊"],
    teen: ["Correct.", "Nailed it.", "Yes — that's it."],
    adult: ["Correct.", "Well done.", "That's right."]
  };
  const MISS = { kid: "Nice try!", teen: "Not this one.", adult: "Not quite." };

  // ---------------------------------------------------------------- state
  const app = {
    name: "",
    age: null,
    S: null,              // engine session
    plan: [],
    pages: [],
    spreadStart: 0,
    mode: "double",
    turning: false,
    rubric: {},           // teacher rubric per speaking entry index
    audio: {},            // speaking entry index -> {url, mime}
    resultsDirty: false
  };

  function theme() { return app.age ? AGES[app.age].theme : "default"; }
  function computeMode() {
    const w = window.innerWidth, h = window.innerHeight;
    return (w >= 860 && w / h >= 1.05) ? "double" : "single";
  }
  function per() { return app.mode === "double" ? 2 : 1; }
  function chapterIcon(ch) { return ch.id === "boss" ? (BOSS_ICON[theme()] || "🐉") : ch.icon; }

  function buildPlan() {
    const p = [{ kind: "cover" }, { kind: "form" }, { kind: "howto" }];
    CHAPTERS.forEach((ch, ci) => {
      p.push({ kind: "opener", chapter: ci });
      for (let i = 0; i < ch.n; i++) p.push({ kind: ch.id === "speaking" ? "speak" : "task", chapter: ci, idx: i });
    });
    p.push({ kind: "passport" }, { kind: "summary" });
    return p;
  }

  // ---------------------------------------------------------------- materialise pages lazily
  // Tasks are chosen only when their page is about to appear, so every page
  // benefits from all answers given before it (that's what makes it adaptive).
  function ensure(i) {
    if (i < 0 || i >= app.plan.length) return null;
    if (app.pages[i]) return app.pages[i];
    let d = app.plan[i];

    // keep the passport on a left page in two-page mode
    if (d.kind === "passport" && app.mode === "double" && i === app.spreadStart + 1) {
      app.plan.splice(i, 0, { kind: "filler" });
      d = app.plan[i];
    }

    const page = { i, d, done: false };
    const S = app.S;
    if (["cover", "howto", "opener", "filler", "summary"].includes(d.kind)) page.done = true;
    if (d.kind === "form") page.done = formValid();
    if (d.kind === "passport") {
      page.done = true;
      if (S && !S.finishedAt) { S.finish(); stopMic(); }
    }

    if ((d.kind === "task" || d.kind === "speak") && !S) { page.d = { kind: "filler", chapter: d.chapter }; page.done = true; }

    if (d.kind === "task" && S) {
      const ch = CHAPTERS[d.chapter];
      let item = null;
      if (ch.id === "quickstart") item = S.pickQuickStart(d.idx);
      else if (ch.id === "boss") {
        const prev = app.pages.filter(p => p && p.d.kind === "task" && CHAPTERS[p.d.chapter].id === "boss" && p.item).map(p => p.item);
        item = S.pickBoss(prev);
      } else item = S.pickItem(ch.id);
      if (!item) { page.d = { kind: "filler", chapter: d.chapter }; page.done = true; }
      else {
        page.item = item;
        page.order = shuffle(item.options.map((_, k) => k));
        page.plays = 0;
        page.noAudio = item.skill === "listening" && !("speechSynthesis" in window);
      }
    }

    if (d.kind === "speak" && S) {
      if (d.idx === 0) {
        const item = S.pickSpeaking();
        if (!item) { page.d = { kind: "filler", chapter: d.chapter }; page.done = true; }
        else Object.assign(page, { item, prompt: item.prompt, levelIdx: LEVELS.indexOf(item.cefr), target: item.targetDuration || 30, stage: "base", kind: "base" });
      } else {
        const base = app.pages.find(p => p && p.d.kind === "speak" && p.d.idx === 0);
        if (!base || !base.item) { page.d = { kind: "filler", chapter: d.chapter }; page.done = true; }
        else {
          const fu = S.followUpFor(base.item, base.entry);
          Object.assign(page, { item: base.item, prompt: fu.prompt, levelIdx: fu.levelIdx, target: base.item.targetDuration || 30, stage: "follow", kind: fu.kind, basePrompt: base.prompt });
        }
      }
      page.sp = { mode: "idle", transcript: "", interim: "", typed: "", durationSec: 0, rerecords: 0 };
    }

    app.pages[i] = page;
    return page;
  }

  function formValid() { return app.name.trim().length > 0 && !!app.age; }

  // ---------------------------------------------------------------- page HTML
  function pageHTML(page) {
    if (!page) return placeholderHTML();
    switch (page.d.kind) {
      case "cover": return coverHTML();
      case "form": return formHTML();
      case "howto": return howtoHTML();
      case "opener": return openerHTML(page);
      case "task": return taskHTML(page);
      case "speak": return speakHTML(page);
      case "filler": return fillerHTML();
      case "passport": return passportHTML();
      case "summary": return summaryHTML();
    }
    return "";
  }

  function placeholderHTML() {
    return `<div class="pg pg-center"><div class="pg-body pg-center placeholder">
      <div class="orn">✦ ✦ ✦</div>
      <div>Your next challenge appears here</div>
      <div class="ua">Спершу дай відповідь на лівій сторінці</div>
    </div></div>`;
  }

  function coverHTML() {
    const em = app.age ? AGES[app.age].emblem : "📖";
    return `<div class="pg pg-center"><div class="pg-body pg-center">
      <div class="eyebrow">An interactive English placement book</div>
      <div class="cover-emblem" aria-hidden="true">${em}</div>
      <h1 class="cover-title">English Level Quest</h1>
      <div class="cover-sub">Discover your English level — one page at a time.</div>
      <div class="ua">Дізнайся свій рівень англійської — сторінка за сторінкою.</div>
      <div class="cover-stars" aria-hidden="true"><span>✦</span><span>★</span><span>✦</span></div>
      <div class="cover-meta"><span>A1 → C1</span><span>⏱ 15–20 min</span><span>7 chapters + boss</span></div>
    </div></div>`;
  }

  function formHTML() {
    const cards = Object.entries(AGES).map(([key, a]) => `
      <button type="button" class="age-card ${app.age === key ? "selected" : ""}" data-action="age" data-age="${key}" aria-pressed="${app.age === key}">
        <span class="age-ico" aria-hidden="true">${a.icon}</span>
        <span><b>${key === "adult" ? "Adult" : key.replace("-", "–")} · ${a.title}</b><small>${a.ua} · ${a.blurb}</small></span>
      </button>`).join("");
    return `<div class="pg"><div class="pg-body">
      <div><div class="eyebrow">Before we start</div><h2>Who is reading this book?</h2><div class="ua">Хто проходить квест?</div></div>
      <label class="field"><span style="display:block;font-weight:800;margin-bottom:.35em">Your name <span class="ua">· Ім'я</span></span>
        <input class="text-input" data-field="name" maxlength="40" autocomplete="off" placeholder="e.g. Sofia" value="${esc(app.name)}"></label>
      <div class="field"><label>Choose your track <span class="ua">· Обери вікову групу</span></label><div class="age-cards">${cards}</div></div>
      <div class="form-note">🎙️ Speak Up uses your microphone — or you can type. Nothing is uploaded: results stay on this device.<br><span class="ua">Відповіді нікуди не надсилаються — усе залишається на цьому пристрої.</span></div>
    </div></div>`;
  }

  function howtoHTML() {
    const rows = [
      ["📖", "One task per page. Answer, then turn the page.", "Одне завдання на сторінці. Відповідай і гортай далі."],
      ["🧭", "The book adapts to you — tasks get easier or harder. It's normal if some feel difficult.", "Книжка підлаштовується під тебе — складні завдання є нормою."],
      ["🎧", "Listening: you can play each recording twice.", "Аудіо можна прослухати двічі."],
      ["🎙️", "Speaking: record your answer or type it. Your teacher will listen.", "Говоріння: запиши відповідь або напиши її."],
      ["⏱️", "About 15–20 minutes. No timer on tasks.", "Приблизно 15–20 хвилин, без таймера."],
      ["🏅", "At the end you get your English Level Passport.", "У кінці — твій паспорт рівня англійської."]
    ].map(r => `<li><span class="ico" aria-hidden="true">${r[0]}</span><span>${esc(r[1])}<small>${esc(r[2])}</small></span></li>`).join("");
    return `<div class="pg"><div class="pg-body">
      <div><div class="eyebrow">How it works</div><h2>How the quest works</h2><div class="ua">Як проходить квест</div></div>

  function openerHTML(page) {
    const ch = CHAPTERS[page.d.chapter];
    const t = theme();
    let voice = "";
    if (t === "kid") voice = `<div class="mascot"><span class="face" aria-hidden="true">🦊</span><div class="bubble them"><span class="who">Lex</span>${esc(LEX[ch.id])}</div></div>`;
    else if (t === "teen") voice = `<div class="bubble them big" style="align-self:center;text-align:center">${esc(TEEN_CAPTION[ch.id])}</div>`;
    return `<div class="pg pg-center"><div class="pg-body pg-center">
      <div class="eyebrow">Chapter ${page.d.chapter + 1} of ${CHAPTERS.length}</div>

      <h2 class="opener-title">${esc(ch.title)}</h2>
